name: IPO Market Refreshes

on:
  schedule:
    - cron: "40 18 * * *"       # 12:10 AM IST
    - cron: "35 4 * * 1-5"      # 10:05 AM IST
    - cron: "35 10 * * 1-5"     # 4:05 PM IST
    - cron: "35 11 * * 1-5"     # 5:05 PM IST
  workflow_dispatch:
    inputs:
      phase:
        description: Refresh phase
        required: false
        default: manual
        type: choice
        options:
          - manual
          - rollover
          - morning
          - sme_close
          - mainboard_close

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ipo-advisor-state-and-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve refresh phase
        id: phase
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_PHASE: ${{ inputs.phase }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=${MANUAL_PHASE:-manual}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT_SCHEDULE" in
            "40 18 * * *") echo "value=rollover" >> "$GITHUB_OUTPUT" ;;
            "35 4 * * 1-5") echo "value=morning" >> "$GITHUB_OUTPUT" ;;
            "35 10 * * 1-5") echo "value=sme_close" >> "$GITHUB_OUTPUT" ;;
            "35 11 * * 1-5") echo "value=mainboard_close" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=manual" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Refresh live IPO dashboard
        env:
          SUBSCRIBE_ENDPOINT: ${{ vars.SUBSCRIBE_ENDPOINT }}
        run: python scripts/cloud_job.py refresh --phase "${{ steps.phase.outputs.value }}"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-advisor-market-refresh-${{ github.run_id }}-${{ github.run_attempt }}-logs
          path: |
            engine/logs/ipo_advisor.log
            engine/logs/ipo_advisor.log.*
          if-no-files-found: warn
          retention-days: 7

      - name: Persist generated state
        run: |
          git config user.name "ipo-advisor-bot"
          git config user.email "ipo-advisor-bot@users.noreply.github.com"
          git add state site/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: IPO market refresh (${{ steps.phase.outputs.value }})"
            # Fail safely if another writer advanced the branch; never merge SQLite blindly.
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: pages_artifact
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait for Pages artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          for i in {1..24}; do
            if gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.expired == false) | .name' | grep -Fx -- "$ARTIFACT_NAME"; then
              echo "Pages artifact is visible."
              sleep 5
              exit 0
            fi
            echo "Waiting for Pages artifact ($i/24)..."
            sleep 5
          done
          echo "::error::Pages artifact not visible after retries"
          exit 1

      - uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
