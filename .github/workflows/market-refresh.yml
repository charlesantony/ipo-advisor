name: IPO Market Refreshes

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Refresh phase
        required: false
        default: manual
        type: choice
        options:
          - manual
          - rollover
          - morning
          - sme_close
          - mainboard_close

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ipo-advisor-state-and-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh live IPO dashboard
        env:
          SUBSCRIBE_ENDPOINT: ${{ vars.SUBSCRIBE_ENDPOINT }}
        run: python scripts/cloud_job.py refresh --phase "${{ inputs.phase || 'manual' }}"

      - name: Persist generated state
        run: |
          git config user.name "ipo-advisor-bot"
          git config user.email "ipo-advisor-bot@users.noreply.github.com"
          git add state site/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: IPO market refresh (${{ inputs.phase || 'manual' }})"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
