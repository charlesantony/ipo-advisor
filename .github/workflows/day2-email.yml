name: Day-2 IPO Early Email

on:
  schedule:
    # 14:15 UTC = 7:45 PM IST.
    # Start 45 minutes early to absorb GitHub scheduler delays.
    # Python waits until 8:30 PM IST before evaluating the Day-2 signal.
    - cron: "15 14 * * 1-5"
  workflow_dispatch:
    inputs:
      wait_for_checkpoint:
        description: Wait until 8:30 PM IST before evaluating
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ipo-advisor-day2-checkpoint
  cancel-in-progress: false

jobs:
  day2:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Day-2 early signal job
        env:
          SUBSCRIBE_ENDPOINT: ${{ vars.SUBSCRIBE_ENDPOINT }}
          EMAIL_ALERT_KEY: ${{ secrets.EMAIL_ALERT_KEY }}
          PUBLIC_DASHBOARD_URL: ${{ vars.PUBLIC_DASHBOARD_URL }}
          FORCE_CHECKPOINT_WAIT: ${{ inputs.wait_for_checkpoint }}
        run: python scripts/cloud_job.py day2 --wait-until-2030

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-advisor-day2-${{ github.run_id }}-logs
          path: |
            engine/logs/ipo_advisor.log
            engine/logs/ipo_advisor.log.*
          if-no-files-found: warn
          retention-days: 7

      - name: Persist generated state
        run: |
          git config user.name "ipo-advisor-bot"
          git config user.email "ipo-advisor-bot@users.noreply.github.com"
          git add state site/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: Day-2 IPO early signal snapshot"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
