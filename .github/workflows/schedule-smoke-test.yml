name: Schedule Smoke Test

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm scheduled execution
        run: |
          echo "GitHub scheduled workflow executed successfully."
          echo "Event: $GITHUB_EVENT_NAME"
          echo "UTC:"
          date -u
