name: Deploy Pages on Code Change

on:
  push:
    branches: ["main"]
    paths:
      - "site/index.html"
      - "site/app.js"
      - "site/style.css"
      - "site/tracker-live-sync.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-only
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh live data before code deploy
        run: python scripts/cloud_job.py live

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
