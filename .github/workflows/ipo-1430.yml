name: 2:30 PM IPO Decision and Email

on:
  schedule:
    # 08:15 UTC = 1:45 PM IST.
    # Start 45 minutes early to absorb GitHub scheduler delays.
    # Python waits until 2:30 PM IST before the canonical capture.
    - cron: "15 8 * * 1-5"
  workflow_dispatch:
    inputs:
      wait_for_checkpoint:
        description: Wait until 2:30 PM IST before capturing
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ipo-advisor-1430-checkpoint
  cancel-in-progress: false

jobs:
  decision:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run canonical decision job
        env:
          SUBSCRIBE_ENDPOINT: ${{ vars.SUBSCRIBE_ENDPOINT }}
          EMAIL_ALERT_KEY: ${{ secrets.EMAIL_ALERT_KEY }}
          PUBLIC_DASHBOARD_URL: ${{ vars.PUBLIC_DASHBOARD_URL }}
          FORCE_CHECKPOINT_WAIT: ${{ inputs.wait_for_checkpoint }}
        run: python scripts/cloud_job.py decision --wait-until-1430

      - name: Persist generated state
        run: |
          git config user.name "ipo-advisor-bot"
          git config user.email "ipo-advisor-bot@users.noreply.github.com"
          git add state site/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: 2:30 PM IPO decision snapshot"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
