name: 2:30 PM IPO Decision and Email

on:
  # Dispatched externally by Google Apps Script for time-critical execution.
  workflow_dispatch:
    inputs:
      wait_for_checkpoint:
        description: Wait until 2:30 PM IST before capturing
        required: false
        default: "false"
      record_as_checkpoint:
        description: Recovery run - record missing closing IPOs in Prospective
        required: false
        default: "true"

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ipo-advisor-1430-checkpoint
  cancel-in-progress: false

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run canonical decision job
        env:
          SUBSCRIBE_ENDPOINT: ${{ vars.SUBSCRIBE_ENDPOINT }}
          EMAIL_ALERT_KEY: ${{ secrets.EMAIL_ALERT_KEY }}
          PUBLIC_DASHBOARD_URL: ${{ vars.PUBLIC_DASHBOARD_URL }}
          FORCE_CHECKPOINT_WAIT: ${{ inputs.wait_for_checkpoint }}
          MANUAL_CHECKPOINT_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.record_as_checkpoint == 'true' && '1' || '0' }}
        run: python scripts/cloud_job.py decision --wait-until-1430

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-advisor-1430-${{ github.run_id }}-${{ github.run_attempt }}-logs
          path: |
            engine/logs/ipo_advisor.log
            engine/logs/ipo_advisor.log.*
          if-no-files-found: warn
          retention-days: 7

      - name: Persist generated state
        if: ${{ hashFiles('.stale_schedule_skip') == '' }}
        run: |
          git config user.name "ipo-advisor-bot"
          git config user.email "ipo-advisor-bot@users.noreply.github.com"
          git add state site/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: 2:30 PM IPO decision snapshot"
            # Fail safely if another writer advanced the branch; never merge SQLite blindly.
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v6
        if: ${{ hashFiles('.stale_schedule_skip') == '' }}
      - uses: actions/upload-pages-artifact@v5
        if: ${{ hashFiles('.stale_schedule_skip') == '' }}
        id: pages_artifact
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait for Pages artifact availability
        if: ${{ hashFiles('.stale_schedule_skip') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          for i in {1..24}; do
            if gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.expired == false) | .name' | grep -Fx -- "$ARTIFACT_NAME"; then
              echo "Pages artifact is visible."
              sleep 5
              exit 0
            fi
            echo "Waiting for Pages artifact ($i/24)..."
            sleep 5
          done
          echo "::error::Pages artifact not visible after retries"
          exit 1

      - uses: actions/deploy-pages@v5
        if: ${{ hashFiles('.stale_schedule_skip') == '' }}
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
