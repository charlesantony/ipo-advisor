name: 2:30 PM IPO Decision and WhatsApp

on:
  schedule:
    # Start 15 minutes early; the Python job waits until 14:30 IST.
    - cron: "15 14 * * 1-5"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ipo-advisor-state-and-pages
  cancel-in-progress: false

jobs:
  decision:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run canonical decision job
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
          WHATSAPP_GRAPH_VERSION: ${{ vars.WHATSAPP_GRAPH_VERSION }}
          WHATSAPP_TEMPLATE_LANG: ${{ vars.WHATSAPP_TEMPLATE_LANG }}
          PUBLIC_DASHBOARD_URL: ${{ vars.PUBLIC_DASHBOARD_URL }}
          WHATSAPP_DRY_RUN: ${{ vars.WHATSAPP_DRY_RUN }}
        run: python scripts/cloud_job.py decision --wait-until-1430

      - name: Persist generated state
        run: |
          git config user.name "ipo-advisor-bot"
          git config user.email "ipo-advisor-bot@users.noreply.github.com"
          git add state site/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: 2:30 PM IPO decision snapshot"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
