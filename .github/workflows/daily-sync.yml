name: Daily IPO Outcome Sync

on:
  schedule:
    - cron: "5 6 * * 1-5"       # 11:35 AM IST listing/outcome refresh
    - cron: "37 12 * * 1-5"     # 6:07 PM IST end-of-day outcome refresh
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ipo-advisor-state-and-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh 2026 outcomes and prospective report
        env:
          SUBSCRIBE_ENDPOINT: ${{ vars.SUBSCRIBE_ENDPOINT }}
        run: python scripts/cloud_job.py daily

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-advisor-daily-sync-${{ github.run_id }}-logs
          path: |
            engine/logs/ipo_advisor.log
            engine/logs/ipo_advisor.log.*
          if-no-files-found: warn
          retention-days: 7

      - name: Persist generated state
        run: |
          git config user.name "ipo-advisor-bot"
          git config user.email "ipo-advisor-bot@users.noreply.github.com"
          git add state site/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily IPO outcome sync"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
