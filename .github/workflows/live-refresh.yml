name: Live IPO Dashboard Refresh

on:
  schedule:
    # Plain UTC cron. IST live refreshes:
    # 10:35, 11:05, 11:35, 12:05, 12:35, 13:05, 13:35,
    # 14:05, 15:05, 15:35 and 16:35 on weekdays.
    # 14:35 is intentionally skipped because the 14:30 canonical workflow
    # has just run. 16:05 and 17:05 are handled by market-refresh.yml.
    - cron: "5 5-8 * * 1-5"
    - cron: "35 5-9 * * 1-5"
    - cron: "5 10-11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ipo-advisor-state-and-pages
  cancel-in-progress: false

jobs:
  live-refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh public live IPO data only
        run: python scripts/cloud_job.py live

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-advisor-live-refresh-${{ github.run_id }}-logs
          path: |
            engine/logs/ipo_advisor.log
            engine/logs/ipo_advisor.log.*
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
